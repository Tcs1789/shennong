<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紅茶媽媽 三重神農店</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="紅茶媽媽三重神農店，五谷王北街上的原葉茶飲。線上訂購、自取、外送。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap">
<style>
/* Layout: one quiet column like a tea-house leaflet; a vertical-set hero line is the single bold move, everything else is rules and whitespace */
:root{
  --paper:#f3f2ec; --sheet:#fbfaf6; --ink:#1e221f; --muted:#6c716a; --rule:#d8d7cd;
  --leaf:#3e5b45; --leaf-soft:#e3e9e1; --on-leaf:#f7f7f2; --warn:#9a5b12; --err:#a8322a;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151715; --sheet:#1c1f1c; --ink:#e9e8e0; --muted:#a3a79f; --rule:#343833;
  --leaf:#9fc1a5; --leaf-soft:#25302a; --on-leaf:#151715; --warn:#e2a95a; --err:#f08a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151715; --sheet:#1c1f1c; --ink:#e9e8e0; --muted:#a3a79f; --rule:#343833;
  --leaf:#9fc1a5; --leaf-soft:#25302a; --on-leaf:#151715; --warn:#e2a95a; --err:#f08a80; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
.wrap{max-width:640px;margin:0 auto}
a{color:inherit}
.serif{font-family:var(--serif)}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--leaf);outline-offset:3px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;padding-block:18px;font-size:13px;color:var(--muted);gap:12px;flex-wrap:wrap}
.top nav{display:flex;gap:16px}
.top nav a{text-decoration:none}
.top nav a:hover{color:var(--ink)}
.lang{border:1px solid var(--rule);background:none;color:inherit;font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;cursor:pointer;letter-spacing:.05em}
.top-r{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.open{display:inline-flex;align-items:center;gap:6px}
.open i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.open.on i{background:var(--leaf)}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-block:40px 48px;border-bottom:1px solid var(--rule)}
.hero-main{min-width:0}
.hero .eyebrow{font-size:12px;letter-spacing:.3em;color:var(--muted)}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,9vw,52px);line-height:1.15;margin:10px 0 18px;letter-spacing:.06em}
.hero h1 small{display:block;font-size:.42em;font-weight:400;letter-spacing:.35em;margin-top:10px;color:var(--muted)}
.hero p{margin:0 0 24px;max-width:26em;color:var(--muted)}
.vert{writing-mode:vertical-rl;font-family:var(--serif);font-size:clamp(22px,5.5vw,30px);letter-spacing:.32em;line-height:1.6;
  border-left:1px solid var(--rule);padding-left:16px;max-height:15em}
.vert span{color:var(--leaf)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:11px 22px;border-radius:2px;text-decoration:none;cursor:pointer;font-size:15px;letter-spacing:.08em}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.leaf{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.btn.line{background:#06c755;border-color:#06c755;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{display:flex;width:100%}

/* sections */
section{padding-block:44px;border-bottom:1px solid var(--rule)}
.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:22px}
.sec-h h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;letter-spacing:.12em}
.sec-h span{font-size:11px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}

/* news */
.news{list-style:none;margin:0;padding:0}
.news li{display:grid;grid-template-columns:5.5em 1fr;gap:12px;padding-block:10px;border-top:1px dashed var(--rule)}
.news li:first-child{border-top:0;padding-top:0}
.news time{color:var(--muted);font-size:13px}
.news div{min-width:0}
.promo{display:block;text-decoration:none;border:1px solid var(--leaf);background:var(--leaf-soft);color:var(--ink);padding:12px 14px;margin-top:18px}
.promo b{font-family:var(--serif);color:var(--leaf);letter-spacing:.08em;margin-right:8px}
.promo small{display:block;color:var(--muted);font-size:12px}
.item .pr s{color:var(--muted);font-size:13px;margin-right:6px}
.tag.sale{border-color:var(--leaf);background:var(--leaf);color:var(--on-leaf)}

/* menu */
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:4px;overflow-x:auto;padding-block:8px 10px;margin-bottom:6px;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.cats button{flex:none;border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted);font-family:var(--serif);font-size:16px;letter-spacing:.1em;border-bottom:2px solid transparent}
.cats button.on{color:var(--ink);border-bottom-color:var(--leaf)}
.cat-h{font-family:var(--serif);font-size:17px;letter-spacing:.2em;margin:28px 0 4px;color:var(--leaf)}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.item .nm{flex:1;min-width:0}
.item .nm b{font-weight:500}
.tag{display:inline-block;font-size:11px;margin-left:6px;padding:0 5px;border:1px solid var(--rule);color:var(--muted);vertical-align:2px;line-height:1.6}
.tag.hot{border-color:var(--leaf);color:var(--leaf)}
.dots{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-4px);min-width:12px}
.item .pr{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:16px}
.item .cnt{font-size:12px;color:var(--leaf);font-weight:600;min-width:2.2em;text-align:right}
.item .add{width:28px;height:28px;border-radius:50%;border:1px solid var(--ink);background:none;font-size:17px;line-height:1;cursor:pointer;flex:none}
.legend{font-size:13px;color:var(--muted);margin-top:16px}

/* slip */
.slip{background:var(--sheet);border:1px solid var(--rule);padding:22px 18px;margin-top:32px}
.slip h3{font-family:var(--serif);font-weight:600;margin:0 0 6px;letter-spacing:.15em;font-size:18px}
.li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--rule);font-size:14px}
.li .d{flex:1;min-width:0}
.li .o{color:var(--muted);font-size:12px}
.li .p{font-family:var(--serif);font-variant-numeric:tabular-nums}
.li .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline}
.empty{color:var(--muted);font-size:14px;padding-block:6px}
.lbl{font-size:13px;color:var(--muted);margin:18px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;border:1px solid var(--rule);padding:5px 12px;font-size:14px;cursor:pointer;background:var(--sheet)}
.chips input:checked+span{border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf)}
.chips input:focus-visible+span{outline:2px solid var(--leaf);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:12px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{font-size:16px;padding:9px 10px;border:1px solid var(--rule);border-radius:0;background:var(--paper);width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.hint.err{color:var(--err)}
.hp{position:absolute;left:-9999px}

/* info */
.rules{display:grid;gap:14px}
.rule{display:grid;grid-template-columns:6em 1fr;gap:12px}
.rule b{font-family:var(--serif);font-weight:600;letter-spacing:.1em}
.rule div{min-width:0}
.hours{width:100%;border-collapse:collapse;font-size:15px}
.hours td{padding:7px 0;border-bottom:1px solid var(--rule)}
.hours td:last-child{text-align:right;font-family:var(--serif);font-variant-numeric:tabular-nums}
.hours tr.today td{color:var(--leaf);font-weight:600}
.addr{margin-top:22px;display:grid;gap:6px}
footer{padding-block:36px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.2em}

/* sheet + bar */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);max-height:88vh;overflow:auto;border-top:1px solid var(--rule);
  padding:22px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:640px;margin:0 auto}
.sheet h3{font-family:var(--serif);font-size:22px;margin:0;letter-spacing:.08em}
.qty{display:flex;align-items:center;gap:16px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:none;font-size:18px;cursor:pointer}
.qty input{font-family:var(--serif);font-size:20px;width:3.2em;text-align:center;padding:4px;border:1px solid var(--rule);border-radius:6px;background:transparent;color:inherit}
.li .lq{width:3.4em;font-size:14px;padding:2px 4px;margin-left:4px;border:1px solid var(--rule);border-radius:4px;background:transparent;color:inherit;text-align:center}
.confirm pre{white-space:pre-wrap;font-size:14px;line-height:1.7;background:var(--bg);border:1px solid var(--rule);padding:12px;border-radius:6px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--sheet);border-top:1px solid var(--rule);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar .sum{flex:1;min-width:0}
.bar .tot{font-family:var(--serif);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.meter{height:3px;background:var(--rule);margin-top:4px}
.meter i{display:block;height:100%;background:var(--leaf);width:0;transition:width .25s}
.need{font-size:12px;color:var(--muted)}
.demo{border:1px dashed var(--warn);color:var(--warn);font-size:13px;padding:8px 10px;margin-top:14px}
.done{text-align:center;padding-block:48px 24px}
.done .no{font-family:var(--serif);font-size:36px;font-weight:700;color:var(--leaf);letter-spacing:.06em}
.done pre{text-align:left;white-space:pre-wrap;background:var(--sheet);border:1px solid var(--rule);padding:14px;font:inherit;font-size:13px;margin-block:18px}
@media (max-width:420px){ .hero{gap:14px;padding-top:24px} .vert{font-size:20px;padding-left:10px} .hero h1{font-size:34px} .top nav{gap:12px} }
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>

<div class="wrap" id="app">
  <div class="top">
    <span class="open" id="openState"><i></i><span></span></span>
    <div class="top-r"><nav aria-label="頁面導覽"><a href="#news" data-en="News">公告</a><a href="#order" data-en="Menu">菜單訂購</a><a href="#delivery" data-en="Delivery">外送</a><a href="#visit" data-en="Store">門市資訊</a></nav><button type="button" class="lang" id="langBtn" aria-label="Switch language">EN</button></div>
  </div>

  <header class="hero">
    <div class="hero-main">
      <h1 id="h1"></h1>
      <p id="intro"></p>
      <div class="cta">
        <a class="btn leaf" href="#order" data-en="Order online">線上訂購</a>
        <a class="btn ghost" id="telBtn" href="#"></a>
      </div>
    </div>
    <div class="vert" id="vert" aria-hidden="true"></div>
  </header>
  <div id="promos"></div>

  <section id="news">
    <div class="sec-h"><h2 data-en="News">公告</h2><span data-en="">News</span></div>
    <ul class="news" id="newsList"></ul>
  </section>

  <section id="order">
    <div class="sec-h"><h2 data-en="Menu">菜單</h2><span data-en="Tap a drink to add it">Menu · 點選加入訂單</span></div>
    <div class="cats" id="cats"></div>
    <div id="menu"></div>
    <div class="legend" id="legend"></div>

    <form class="slip" id="slip" novalidate>
      <h3 data-en="Your order">訂單</h3>
      <div id="lines"></div>

      <div class="lbl" data-en="Pickup or delivery">取餐方式</div>
      <div class="chips">
        <label><input type="radio" name="mode" id="modePickup" value="自取" checked><span data-en="Pickup">到店自取</span></label>
        <label><input type="radio" name="mode" id="modeDelivery" value="外送"><span data-en="Delivery">外送</span></label>
      </div>
      <div class="hint" id="modeHint"></div>

      <div id="deliveryFields" hidden>
        <div class="field"><label for="dist" data-en="Distance from the shop">離店裡多遠</label><select id="dist"></select></div>
        <div class="field" id="companyField" hidden><label for="company" data-en="Company (optional)">公司／單位名稱（選填）</label><input id="company" autocomplete="organization"></div>
        <div class="field"><label for="addr" data-en="Delivery address (required)">外送地址（必填）</label><input id="addr" required autocomplete="street-address" placeholder="例：三重區五谷王北街○○號 3 樓" data-en-ph="Street, number, floor"></div>
      </div>
      <div class="field"><label for="name" data-en="Name">姓名</label><input id="name" autocomplete="name"></div>
      <div class="row2">
        <div class="field"><label for="tel" data-en="Mobile (or landline)">手機（二擇一）</label><input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="09xx-xxx-xxx"></div>
        <div class="field"><label for="tel2" data-en="Landline (or mobile)">市話（二擇一）</label><input id="tel2" type="tel" inputmode="tel" placeholder="02-xxxx-xxxx #分機" data-en-ph="02-xxxx-xxxx #ext"></div>
      </div>
      <p class="hint" style="margin:-4px 0 12px" data-en="One phone number is enough — mobile or landline.">手機、市話擇一填寫即可，公司訂購可以留公司電話。</p>
      <div class="row2">
        <div class="field"><label for="day" data-en="Date">日期</label><select id="day"></select></div>
        <div class="field"><label for="time" data-en="Time">時間</label><select id="time"></select></div>
      </div>
      <div class="field"><label for="code" data-en="Promo code (optional)">優惠碼（選填）</label><input id="code" autocomplete="off" autocapitalize="characters"></div>
      <div class="field"><label for="note" data-en="Notes (optional)">備註（選填）</label><textarea id="note" rows="2" placeholder="例：分兩袋裝、到了打電話" data-en-ph="e.g. split into two bags, call on arrival"></textarea></div>
      <div class="field"><label for="bags" data-en="Plastic bags ($1 each, 0 if none)">塑膠袋（$1／個，不需要填 0）</label><div class="qty"><button type="button" id="bMinus" aria-label="減少">−</button><input id="bags" type="number" inputmode="numeric" min="0" max="99" value="0" aria-label="塑膠袋數量"><button type="button" id="bPlus" aria-label="增加">+</button></div></div>
      <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="hint err" id="formErr" hidden></div>
      <div class="demo" id="demoNote" hidden data-en="Preview mode: orders will not be sent to the shop.">目前是預覽模式，送出的訂單不會傳到店裡。</div>
    </form>
  </section>

  <section id="delivery">
    <div class="sec-h"><h2 data-en="Delivery">外送</h2><span data-en="">Delivery</span></div>
    <div class="rules" id="rules"></div>
  </section>

  <section id="visit">
    <div class="sec-h"><h2 data-en="Store">門市資訊</h2><span data-en="">Store</span></div>
    <table class="hours" id="hours"></table>
    <div class="addr">
      <div id="addrTxt"></div>
      <div><a id="mapLink" href="#" target="_blank" rel="noopener" data-en="Open in Google Maps →">在 Google 地圖開啟 →</a></div>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="sum">
      <div class="tot" id="tot">$0</div>
      <div class="meter" id="meter" hidden><i id="meterFill"></i></div>
      <div class="need" id="need"></div>
    </div>
    <button class="btn leaf" id="submitBtn" type="button" data-en="Place order">送出訂單</button>
  </div>
</div>

<div class="mask" id="mask" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetBody"></div></div>

<script>document.write('<script src="data.js?t=' + Date.now() + '"><\/script>');</script>
<script>
var S = window.SITE;
var cart = [];
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var money = function(n){ return '$' + n.toLocaleString('en-US'); };
var WD = ['日','一','二','三','四','五','六'], WDE = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var LANG = (function(){ var q = (location.search.match(/[?&]lang=(en|zh)/) || [])[1]; try { return q || localStorage.getItem('lang') || 'zh'; } catch(e){ return q || 'zh'; } })();
var EN = function(){ return LANG === 'en'; };
var T = function(zh, en){ return EN() ? en : zh; };
var N = function(zh){ return EN() && S.en && S.en[zh] || zh; };
var wd = function(i){ return EN() ? WDE[i] : WD[i]; };
function optsT(o){
  if (!EN()) return o;
  return o.split('／').map(function(x){ return x.charAt(0)==='加' && S.en[x.slice(1)] ? '+ ' + S.en[x.slice(1)] : N(x); }).join(' / ');
}
function applyStatic(){
  document.documentElement.lang = EN() ? 'en' : 'zh-Hant';
  document.querySelectorAll('[data-en]').forEach(function(el){
    if (el.dataset.zh == null) el.dataset.zh = el.textContent;
    el.textContent = EN() ? el.dataset.en : el.dataset.zh;
  });
  document.querySelectorAll('[data-en-ph]').forEach(function(el){
    if (el.dataset.zhPh == null) el.dataset.zhPh = el.placeholder;
    el.placeholder = EN() ? el.dataset.enPh : el.dataset.zhPh;
  });
  $('langBtn').textContent = EN() ? '中文' : 'EN';
}
function dayLabelZh(ds){
  var d = new Date(ds + 'T00:00:00'), t = new Date(), diff = Math.round((d - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 864e5);
  return (diff===0?'今天 ':diff===1?'明天 ':'') + (d.getMonth()+1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）';
}
function distLabel(km, lang){
  var d = S.delivery, en = lang === 'en';
  if (km > d.maxKm) return en ? 'Over ' + d.maxKm + ' km' : d.maxKm + ' 公里以上';
  if (km === d.baseKm) return en ? 'Within ' + d.baseKm + ' km' : d.baseKm + ' 公里內';
  return en ? (km-1) + '–' + km + ' km' : (km-1) + '–' + km + ' 公里';
}
function toMin(t){ var p = t.split(':'); return +p[0]*60 + +p[1]; }
function hm(m){ return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function mode(){ return document.querySelector('input[name=mode]:checked').value; }

/* ---------- static content ---------- */
function renderStatic(){
  $('h1').innerHTML = esc(T(S.storeName, S.storeNameEn || S.storeName)) + '<small>' + esc(T(S.branch, S.branchEn || S.branch)) + '</small>';
  $('intro').textContent = T(S.intro, S.introEn || S.intro);
  var t = [].concat(EN() && S.taglineEn || S.tagline);
  $('vert').style.display = EN() ? 'none' : '';
  $('vert').innerHTML = esc(t[0]) + (t[1] ? '<br><span>' + esc(t[1]) + '</span>' : '');
  $('telBtn').textContent = T('訂購專線 ', 'Call ') + S.phone;
  $('telBtn').href = 'tel:' + S.phone.replace(/\D/g,'');
  var d = new Date(), h = S.hours[d.getDay()], now = d.getHours()*60 + d.getMinutes();

function unitOf(){
  var sz = document.querySelector('input[name=o_size]:checked'), si = sz ? +sz.value : 0;
  var tops = [].map.call(document.querySelectorAll('input[name=o_top]:checked'), function(x){ return S.toppings[+x.value]; });
  var topSum = tops.reduce(function(s,t){ return s+t.price; },0);
  return { size: cur.price.length>1 ? S.sizes[si] : '', tops: tops, base: cur.price[si], topSum: topSum, unit: salePrice(cur.name, cur.price[si], orderDay()) + topSum };
}
function updSheet(typing){ if (typing !== true) $('qNum').value = curQty; $('sheetAdd').textContent = T('加入訂單 ','Add to order ') + money(unitOf().unit * curQty); }
function addCur(){
  var u = unitOf();
  var sugar = cur.fixed ? '固定甜度' : S.sugar[+document.querySelector('input[name=o_sugar]:checked').value];
  var ice = S.ice[+document.querySelector('input[name=o_ice]:checked').value];
  var opts = [u.size, sugar, ice].concat(u.tops.map(function(t){ return '加' + t.name; })).filter(Boolean).join('／');
  var same = cart.find(function(l){ return l.name===cur.name && l.opts===opts; });
  if (same) same.qty += curQty; else cart.push({ name: cur.name, opts: opts, base: u.base, tops: u.topSum, qty: curQty });
  closeSheet(); refresh();
}

/* ---------- promotions ---------- */
function orderDay(){ return ($('day') && $('day').value) || ymd(new Date()); }
function promoOn(p, ds){
  if (p.start && ds < p.start) return false;
  if (p.end && ds > p.end) return false;
  if (p.days && p.days.indexOf(new Date(ds + 'T00:00:00').getDay()) < 0) return false;
  return true;
}
function activePromos(ds){ return (S.promos || []).filter(function(p){ return promoOn(p, ds); }); }
function salePrice(name, base, ds){
  var best = base;
  activePromos(ds).forEach(function(p){
    if (p.type !== 'item-price') return;
    if (p.items && p.items[name] != null) best = Math.min(best, p.items[name]);
    if (p.cat && p.off && catOf(name) === p.cat) best = Math.min(best, base - p.off);
  });
  return best;
}
function catOf(name){
  for (var i = 0; i < S.menu.length; i++) if (S.menu[i].items.some(function(it){ return it.name === name; })) return S.menu[i].cat;
  return '';
}
function unitOfLine(l){ return salePrice(l.name, l.base, orderDay()) + l.tops; }
// 整筆優惠擇一，自動選最划算的
function bestDeal(){
  var ds = orderDay(), sub = subtotal(), n = cups(), code = ($('code') ? $('code').value : '').trim().toUpperCase();
  var deals = [];
  var pctOff = function(rate){ return Math.round(sub * (1 - rate)); };
  var pctDetail = function(rate){ return ['全部 ' + n + ' 杯 $' + sub + ' × ' + Math.round(rate*100)/10 + ' 折'] ; };
  var pctDetailEn = function(rate){ return ['All ' + n + ' cups $' + sub + ' × ' + Math.round(rate*100) + '%'] ; };
  if (preorderOk()) deals.push({ title: '預購滿 ' + S.preorder.cups + ' 杯 9 折', titleEn: 'Pre-order ' + S.preorder.cups + '+ cups: 10% off', off: pctOff(S.preorder.rate), detail: pctDetail(S.preorder.rate), detailEn: pctDetailEn(S.preorder.rate) });
  activePromos(ds).forEach(function(p){
    var off = 0, detail = [], detailEn = [];
    if (p.type === 'second-half'){
      var u = []; cart.forEach(function(l){ for (var i = 0; i < l.qty; i++) u.push({ name: l.name, p: unitOfLine(l) }); });
      u.sort(function(a,b){ return b.p - a.p; });
      var agg = [], at = {};
      for (var i = 1; i < u.length; i += 2){
        var h = Math.floor(u[i].p/2), k = u[i].name + '|' + u[i].p;
        off += h;
        if (!at[k]){ at[k] = { name: u[i].name, p: u[i].p, h: h, c: 0 }; agg.push(at[k]); }
        at[k].c++;
      }
      detail = agg.map(function(a){ return a.name + '（$' + a.p + '）半價 ×' + a.c + ' 杯　−$' + a.h*a.c; });
      detailEn = agg.map(function(a){ return (S.en[a.name] || a.name) + ' ($' + a.p + ') half price ×' + a.c + '  −$' + a.h*a.c; });
    } else if (p.type === 'spend-off' && sub >= p.min){ off = p.off; detail = ['滿 $' + p.min + ' 折 $' + p.off]; detailEn = ['$' + p.off + ' off orders over $' + p.min]; }
    else if (p.type === 'code' && code && code === String(p.code).toUpperCase()){ off = pctOff(p.rate); detail = pctDetail(p.rate); detailEn = pctDetailEn(p.rate); }
    if (off > 0) deals.push({ title: p.title, titleEn: p.en && p.en.title || p.title, off: off, detail: detail, detailEn: detailEn });
  });
  return deals.sort(function(a,b){ return b.off - a.off; })[0] || null;
}

/* ---------- money ---------- */
function subtotal(){ return cart.reduce(function(s,l){ return s + unitOfLine(l)*l.qty; }, 0); }
function listSubtotal(){ return cart.reduce(function(s,l){ return s + (l.base + l.tops)*l.qty; }, 0); }  // 原價（不含任何優惠）
function cups(){ return cart.reduce(function(s,l){ return s + l.qty; }, 0); }
function preorderOk(){
  var p = S.preorder, day = $('day').value;
  if (!p || !day || cups() < p.cups) return false;
  var cut = new Date(day + 'T' + p.cutoff + ':00'); cut.setDate(cut.getDate() - 1);
  return new Date() < cut;
}
function discount(){ var d = bestDeal(); return d ? d.off : 0; }
function bags(){ var n = parseInt(($('bags') || {}).value, 10); return n > 0 ? Math.min(99, n) : 0; }
function bagFee(){ return bags() * 1; }
function drinksTotal(){ return subtotal() - discount(); }
function total(){ return drinksTotal() + bagFee(); }
function minOrder(){
  if (mode() === '自取') return 0;
  var km = +$('dist').value || S.delivery.baseKm;
  if (km > S.delivery.maxKm) return 0;
  return S.delivery.baseMin + Math.max(0, km - S.delivery.baseKm) * S.delivery.stepPerKm;
}

      '<div class="p">' + money(unitOfLine(l)*l.qty) + '</div><button type="button" class="x" data-i="' + i + '">' + T('移除','Remove') + '</button></div>';
  }).join('') +
  (discount() ? '<div class="li"><div class="d">' + T('優惠：','Discount: ') + esc(T(bestDeal().title, bestDeal().titleEn)) + '<div class="o">' + (EN() ? bestDeal().detailEn : bestDeal().detail).map(esc).join('<br>') + '</div></div><div class="p">−' + money(discount()) + '</div></div>' : '') +
  (bags() ? '<div class="li"><div class="d">' + T('塑膠袋 ×','Plastic bags ×') + bags() + '</div><div class="p">' + money(bagFee()) + '</div></div>' : '') +
  '<div class="li"><div class="d"><b>' + T('共 ' + cups() + ' 杯', cups() + (cups()===1 ? ' cup' : ' cups')) + '</b></div><div class="p"><b>' + money(total()) + '</b></div></div>' +
  (discount() ? '<div class="hint">' + T('整筆優惠擇一，已自動幫你選最划算的。','One discount per order — the best one is applied automatically.') + '</div>' : '') +
  (!discount() ? '<div class="hint">' + T('前一天 ' + p.cutoff + ' 前預購滿 ' + p.cups + ' 杯打 9 折' + (cups() >= p.cups ? '，日期選明天以後就有折扣。' : '。'),

}

function slotsFor(ds){
  var d = new Date(ds + 'T00:00:00'), h = S.hours[d.getDay()];
  if (!h) return [];
  var start = toMin(h[0]) + 30, end = toMin(h[1]);
  if (mode() === '團購') end = Math.min(end, toMin(S.groupLatest));
  var now = new Date();
  if (ds === ymd(now)) start = Math.max(start, Math.ceil((now.getHours()*60 + now.getMinutes() + S.leadMinutes)/15)*15);
  var out = []; for (var m = start; m <= end; m += 15) out.push(hm(m)); return out;
}
function renderDays(){
  var keep = $('day').value, o = '', b = new Date();
  for (var i = 0; i <= S.daysAhead; i++){
    var d = new Date(b.getFullYear(), b.getMonth(), b.getDate()+i), s = ymd(d);
    if (!slotsFor(s).length) continue;
    o += '<option value="' + s + '">' + (EN() ? (i===0?'Today ':i===1?'Tomorrow ':'') + wd(d.getDay()) + ' ' + (d.getMonth()+1) + '/' + d.getDate() : dayLabelZh(s)) + '</option>';
  }
  $('day').innerHTML = o;
  if (keep && [].some.call($('day').options, function(x){ return x.value===keep; })) $('day').value = keep;

function refresh(){
  renderMenu(); renderLines();
  var t = listSubtotal(), min = minOrder();  // 外送低消一律用原價（任何優惠前）的飲料金額算
  $('bar').hidden = !cart.length;

  $('need').textContent = min && t < min ? T('外送還差 ','Delivery needs ') + money(min - t) + T('',' more') : T(cups() + ' 杯・' + mode(), cups() + (cups()===1?' cup':' cups') + ' · ' + (mode()==='自取' ? 'Pickup' : 'Delivery'));
  $('submitBtn').disabled = !!(min && t < min);
}

/* ---------- submit ---------- */
function collect(){
  var m = mode();
  var deal = bestDeal();
  return { type: 'order', mode: m, subtotal: subtotal(), discount: discount(), total: total(),
    bags: bags(), bagFee: bagFee(),
    promo: deal ? deal.title : '', promoDetail: deal ? deal.detail : [], code: $('code').value.trim().toUpperCase(),
    items: cart.map(function(l){ return { name: l.name, opts: l.opts, qty: l.qty, unit: unitOfLine(l) }; }),
    dist: m==='自取' ? '' : distLabel(+$('dist').value, 'zh'),
    company: m==='外送' ? $('company').value.trim() : '', addr: m==='自取' ? '' : $('addr').value.trim(),
    name: $('name').value.trim(), mobile: $('tel').value.trim(), landline: $('tel2').value.trim(),
    day: $('day').value, dayLabel: $('day').value ? dayLabelZh($('day').value) : '', time: $('time').value,
    dayLabelEn: $('day').value ? $('day').options[$('day').selectedIndex].text : '',
    promoEn: deal ? deal.titleEn : '', promoDetailEn: deal ? deal.detailEn : [],
    lang: LANG, note: $('note').value.trim(), website: $('website').value };
}
function validate(o){
  if (!o.items.length) return T('還沒有選飲料。', 'Please add a drink first.');
  if (!o.name) return T('請填姓名。', 'Please enter your name.');
  if (!o.mobile && !o.landline) return T('請留一支電話，手機或市話都可以。', 'Please leave a phone number (mobile or landline).');
  if (o.mobile && !/^09\d{8}$/.test(o.mobile.replace(/[\s\-]/g,''))) return T('手機號碼格式不對，請再確認一次（09 開頭共 10 碼）。', 'Mobile number looks wrong (Taiwan mobile: 10 digits starting with 09).');
  if (o.landline && !/^0\d{7,9}$/.test(o.landline.split(/#|分機|轉|ext/i)[0].replace(/[\s\-()（）]/g,''))) return T('市話格式不對，請加上區碼，例：02-2xxx-xxxx #123。', 'Landline looks wrong — include the area code, e.g. 02-2xxx-xxxx #123.');
  o.tel = [o.mobile, o.landline].filter(Boolean).join(' ／ ');
  if (!o.day || !o.time) return T('這幾天沒有可預訂的時段，請直接打訂購專線。', 'No time slots available in the next few days — please call us.');
  if (o.mode !== '自取' && !o.addr){ $('addr').focus(); return T('外送要填地址。', 'Please enter a delivery address.'); }
  return '';
}
function orderText(o, no, lang){
  if (lang === 'en') return orderTextEn(o, no);
  var L = ['【網站訂單】' + (no || ''), o.mode + '｜' + o.dayLabel + ' ' + o.time];
  if (o.company) L.push('公司：' + o.company);
  L.push('姓名：' + o.name + '　電話：' + o.tel);
  if (o.addr) L.push('地址：' + o.addr + '（' + o.dist + '）');
  L.push('—');
  o.items.forEach(function(l){ L.push(l.name + '　' + l.opts, '　單價 $' + l.unit + ' × ' + l.qty + ' 杯 = $' + l.unit*l.qty); });
  if (o.bags) L.push('塑膠袋 ×' + o.bags + '　$' + o.bagFee);
  L.push('—');
  if (o.discount){
    L.push('飲料小計 $' + o.subtotal, '優惠：' + o.promo + '　−$' + o.discount);
    (o.promoDetail || []).forEach(function(d){ L.push('　' + d); });
  }
  L.push('共 ' + o.items.reduce(function(s,l){ return s+l.qty; },0) + ' 杯，合計 $' + o.total);
  if (o.note) L.push('備註：' + o.note);
  return L.join('\n');
}
function orderTextEn(o, no){
  var nm = function(x){ return S.en[x] || x; };
  var L = ['Order ' + (no || ''), (o.mode==='自取' ? 'Pickup' : 'Delivery') + ' | ' + o.dayLabelEn + ' ' + o.time];
  if (o.company) L.push('Company: ' + o.company);
  L.push('Name: ' + o.name + '   Phone: ' + o.tel);
  if (o.addr) L.push('Address: ' + o.addr + ' (' + distLabel(+$('dist').value, 'en') + ')');
  L.push('—');
  o.items.forEach(function(l){
    var opts = l.opts.split('／').map(function(x){ return x.charAt(0)==='加' && S.en[x.slice(1)] ? '+ ' + S.en[x.slice(1)] : nm(x); }).join(' / ');
    L.push(nm(l.name) + '  ' + opts, '  $' + l.unit + ' × ' + l.qty + ' = $' + l.unit*l.qty);
  });
  if (o.bags) L.push('Plastic bags ×' + o.bags + '  $' + o.bagFee);
  L.push('—');
  if (o.discount){
    L.push('Drinks subtotal $' + o.subtotal, 'Discount: ' + o.promoEn + '  −$' + o.discount);
    (o.promoDetailEn || []).forEach(function(d){ L.push('  ' + d); });
  }
  var n = o.items.reduce(function(s,l){ return s+l.qty; },0);
  L.push(n + (n===1?' cup':' cups') + ', total $' + o.total);
  if (o.note) L.push('Notes: ' + o.note);
  return L.join('\n');
}
$('submitBtn').addEventListener('click', function(){
  var o = collect(), err = validate(o);
  $('formErr').hidden = !err; $('formErr').textContent = err;
  if (err){ $('formErr').scrollIntoView({block:'center'}); return; }
  $('sheetBody').innerHTML = '<div class="confirm"><h3 id="sheetTitle">' + T('請確認訂單','Please check your order') + '</h3>' +
    '<p class="hint" style="margin:0 0 10px">' + T('杯數、甜度冰塊、時間和電話都對了再送出。','Make sure the drinks, sweetness, ice, time and phone number are right.') + '</p><pre>' + esc(orderText(o, '', LANG)) + '</pre>' +
    '<div style="display:flex;gap:10px;margin-top:16px"><button type="button" class="btn ghost" id="cfBack" style="flex:1">' + T('返回修改','Go back') + '</button>' +
    '<button type="button" class="btn leaf" id="cfGo" style="flex:2">' + T('確認送出','Confirm order') + '</button></div></div>';
  $('sheetBody').onchange = null;
  $('mask').hidden = false; $('sheet').hidden = false;
  $('cfBack').onclick = closeSheet;
  $('cfGo').onclick = function(){ closeSheet(); sendOrder(o); };
  $('cfGo').focus();
});
function sendOrder(o){
  var btn = $('submitBtn'); btn.disabled = true; btn.textContent = T('送出中…','Sending…');
  var fail = function(msg){
    btn.disabled = false; btn.textContent = T('送出訂單','Place order');
    $('formErr').hidden = false;
    $('formErr').textContent = T('訂單沒有送出：' + (msg || '網路不穩') + '。請再按一次，或打訂購專線 ' + S.phone + '。',
      'Order not sent' + (msg ? ' (' + msg + ')' : '') + '. Please try again, or call ' + S.phone + '.');
    $('formErr').scrollIntoView({block:'center'});
  };
  if (!S.orderEndpoint){ setTimeout(function(){ showDone(o, { ok:true, orderNo:'預覽-001', notified:false }); }, 400); return; }
  fetch(S.orderEndpoint, { method: 'POST', body: JSON.stringify(o) })
    .then(function(r){ return r.json(); })
    .then(function(r){ r && r.ok ? showDone(o, r) : fail(r && r.error); })
    .catch(function(){ fail(); });
}
function showDone(o, r){
  var text = orderText(o, r.orderNo);
  $('bar').hidden = true;
  $('app').innerHTML = '<div class="done"><div class="lbl">' + T('訂單編號','Order number') + '</div><div class="no">' + esc(r.orderNo) + '</div>' +
    (r.notified
      ? '<p>' + T('店裡已經收到訂單。' + (o.mode==='自取' ? '請在 ' + esc(o.time) + ' 到店取餐。' : '會照時間送到。') + '要改單請打 ' + esc(S.phone) + '。',
          'We\'ve received your order. ' + (o.mode==='自取' ? 'Please pick it up at ' + esc(o.time) + '.' : 'We\'ll deliver it on time.') + ' To make changes, call ' + esc(S.phone) + '.') + '</p>'
      : '<p>' + T('還差一步：請按下面的按鈕，用 LINE 把訂單傳給店長，或直接打 ' + esc(S.phone) + '。', 'One more step: tap the button below to send your order to us on LINE, or call ' + esc(S.phone) + '.') + '</p>' +
        '<a class="btn line block" href="https://line.me/R/msg/text/?' + encodeURIComponent(text) + '" target="_blank" rel="noopener">' + T('用 LINE 傳訂單給店長','Send order on LINE') + '</a>') +
    '<pre>' + esc(orderText(o, r.orderNo, LANG)) + '</pre><button type="button" class="btn ghost block" onclick="location.reload()">' + T('回到首頁','Back to home') + '</button></div>';
  window.scrollTo(0,0);
}

$('langBtn').addEventListener('click', function(){
  LANG = EN() ? 'zh' : 'en';
  try { localStorage.setItem('lang', LANG); } catch(e){}
  closeSheet(); applyStatic(); renderStatic(); renderDist(); renderMode(); refresh();
});
applyStatic(); renderStatic(); renderDist(); renderMode(); refresh();
</script>
